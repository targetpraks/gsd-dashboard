server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|json|png|jpg|svg|woff2?)$ {
        # Revalidate on every load (ETag/Last-Modified) so a deploy never
        # leaves browsers with a stale data.js that crashes the new index.html
        add_header Cache-Control "no-cache";
    }
}
